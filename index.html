<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagrammar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instagram+Sans:wght@400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f8f4f4, #fdfbfb);
            font-family: 'Instagram Sans', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #262626;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 45px 35px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #dbdbdb;
        }
        .logo {
            font-size: 58px;
            font-weight: 700;
            background: linear-gradient(45deg, #E1306C, #F56040, #C13584, #833AB4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -4.5px;
        }
        .tagline {
            font-size: 16px;
            color: #8e8e8e;
            margin-bottom: 35px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 15px 16px;
            margin: 10px 0;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #a8a8a8;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            margin: 18px 0 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0077c5; }
        button:disabled { background: #b2d4f0; cursor: not-allowed; }

        .divider {
            height: 1px;
            background: #dbdbdb;
            margin: 30px 0;
            position: relative;
        }
        .divider span {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 20px;
            color: #8e8e8e;
            font-size: 13px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13.5px;
            color: #0095f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">instagrammar</div>
        <div class="tagline">The place to share your world</div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username, email, or phone" autocomplete="off" required>
            <input type="password" id="password" placeholder="Password" autocomplete="off" required>
            <button type="submit" id="submitBtn">Log In</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <button onclick="demoGoogle()" style="background:#fff; color:#0095f6; border:1px solid #dbdbdb; font-weight:500;">
            Continue with Google
        </button>

        <div class="footer">
            <a href="#" style="text-decoration:none; color:inherit;">Forgot your password?</a><br><br>
            Don't have an account? <a href="#" style="text-decoration:none; color:inherit;">Sign up</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            // === LAB LOGGING ONLY ===
            console.log('%c🔴 INSTAGRAMMAR LOGIN CAPTURED — LAB MODE', 
                'color:#E1306C; font-size:18px; font-weight:bold;');
            console.log('Time:', new Date().toISOString());
            console.log('Username/Email/Phone →', username);
            console.log('Password →', password);

            // Save to localStorage for persistence
            let logs = JSON.parse(localStorage.getItem('instagrammar_logs') || '[]');
            logs.push({
                timestamp: new Date().toISOString(),
                username: username,
                password: password
            });
            localStorage.setItem('instagrammar_logs', JSON.stringify(logs));

            console.log('%c✅ Saved to localStorage. Total logs: ' + logs.length, 'color:#00c853;');

            // Visual feedback
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            setTimeout(() => {
                alert('✅ Login Successful (Lab Demo Mode)\n\nCheck browser console (F12) for captured credentials.');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }, 1500);
        });

        function demoGoogle() {
            console.log('%cGoogle login simulation started', 'color:#4285f4; font-weight:bold;');
            alert('Google sign-in flow opened (Lab Demo only)');
        }

        // Show previous logs on load
        window.onload = () => {
            const logs = JSON.parse(localStorage.getItem('instagrammar_logs') || '[]');
            if (logs.length > 0) {
                console.log(`%c${logs.length} previous capture(s) loaded from this browser`, 'color:#ff9800;');
            }
        };
    </script>
</body>
</html>
